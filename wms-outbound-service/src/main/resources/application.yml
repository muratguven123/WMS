server:
  port: 8088

spring:
  application:
    name: wms-outbound-service

  # ============================================================
  # Keycloak — OAuth2 Resource Server (JWT)
  # Gelen Bearer token'lar issuer'a karşı imza + expiry
  # doğrulamasından geçer. JWK anahtar seti Keycloak'tan çekilir.
  # ============================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/wms-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/wms-realm/protocol/openid-connect/certs}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/wms_outbound_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

wms:
  security:
    cors:
      # UI origin'leri — virgulle ayrilmis liste
      allowed-origin-patterns: ${WMS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  core-service:
    url: http://localhost:8081
  inventory-service:
    url: http://localhost:8087
  integration-service:
    url: http://localhost:8085
  webclient:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
  carrier:
    dhl:
      url: http://localhost:8089/api/mock/dhl
    yurtici:
      url: http://localhost:8089/api/mock/yurtici
