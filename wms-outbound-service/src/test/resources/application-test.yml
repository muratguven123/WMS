# Test profili — datasource dinamik olarak OutboundPostgresTestBase (Testcontainers) tarafından sağlanır.
# H2 kaldırıldı: yeni DB testleri yalnız gerçek PostgreSQL (Testcontainers) üzerinde koşar.
spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
