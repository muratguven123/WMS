server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker'ın gömülü DNS resolver'ı. proxy_pass'lerde değişken kullanınca
    # Nginx, upstream host'unu BAŞLANGIÇTA değil, İSTEK anında çözer.
    # Böylece ops profili kapalıyken (wms-inbound vb. yokken) Nginx çökmez;
    # yalnızca o endpoint'e gelen istek 502 döner.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Core service (8081) — auth, users, org, address master (singular /api/address/...), ui, admin geo, ...
    # NOT: /api/addresses (plural) → localization-service; "address" alone would match "addresses".
    location ~ ^/api/(auth|users|org|admin|address/|ui|process-config|approvals|locations|audit|stocks) {
        set $upstream_core http://wms-core-service:8081;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Localization service (8082)
    location ~ ^/api/(v1|addresses) {
        set $upstream_localization http://wms-localization-service:8082;
        proxy_pass $upstream_localization;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Billing service (8084)
    location ~ ^/api/billing {
        set $upstream_billing http://wms-billing-service:8084;
        proxy_pass $upstream_billing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Finance service (8083)
    location ~ ^/api/(rates|taxes|finance) {
        set $upstream_finance http://wms-finance-service:8083;
        proxy_pass $upstream_finance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Integration service (8085)
    location /api/integrations {
        set $upstream_integration http://wms-integration-service:8085;
        proxy_pass $upstream_integration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbound service (8086) — ops profili (varsayılan modda kapalı olabilir)
    location /api/inbound {
        set $upstream_inbound http://wms-inbound-service:8086;
        proxy_pass $upstream_inbound;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inventory service (8087) — ops profili (varsayılan modda kapalı olabilir)
    location /api/inventory {
        set $upstream_inventory http://wms-inventory-service:8087;
        proxy_pass $upstream_inventory;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification service (8089) — WebSocket/STOMP — ops profili (varsayılan modda kapalı olabilir)
    location /ws {
        set $upstream_notification http://wms-notification-service:8089;
        proxy_pass $upstream_notification;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Outbound service (8088) — ops profili (varsayılan modda kapalı olabilir)
    location ~ ^/api/(picking|packing|shipping) {
        set $upstream_outbound http://wms-outbound-service:8088;
        proxy_pass $upstream_outbound;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Active-Company-ID $http_x_active_company_id;
        proxy_set_header X-Active-Location-ID $http_x_active_location_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
