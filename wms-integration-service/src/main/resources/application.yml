server:
  port: 8085

spring:
  application:
    name: wms-integration-service

  # ============================================================
  # Keycloak — OAuth2 Resource Server (JWT)
  # Gelen Bearer token'lar issuer'a karşı imza + expiry
  # doğrulamasından geçer. JWK anahtar seti Keycloak'tan çekilir.
  # ============================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/wms-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/wms-realm/protocol/openid-connect/certs}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/wms_integration_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

# -----------------------------------------------------------------------
# ERP Adapter konfigürasyonları
# -----------------------------------------------------------------------
erp:
  webclient:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    write-timeout-ms: 10000

  sap:
    base-url: http://sap-mock-host/api/wms

  logo:
    sftp:
      host: sftp.logo-mock-host
      port: 22
      user: wms
      password: changeme
      remote-dir: /import
      mock: true

# -----------------------------------------------------------------------
# Outbox Worker konfigürasyonu
# -----------------------------------------------------------------------
outbox:
  worker:
    fixed-delay-ms: 5000
  retry:
    max-attempts: 3
    max-backoff-minutes: 60

# -----------------------------------------------------------------------
# Log arşivleme konfigürasyonu
# -----------------------------------------------------------------------
archive:
  retention-days: 30
  scheduler:
    cron: "0 0 2 1 * *"

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.wms.integration: DEBUG

wms:
  security:
    cors:
      # UI origin'leri — virgulle ayrilmis liste
      allowed-origin-patterns: ${WMS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
