server:
  port: 8084

spring:
  application:
    name: wms-billing-service

  # ============================================================
  # Keycloak — OAuth2 Resource Server (JWT)
  # Gelen Bearer token'lar issuer'a karşı imza + expiry
  # doğrulamasından geçer. JWK anahtar seti Keycloak'tan çekilir.
  # ============================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/wms-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/wms-realm/protocol/openid-connect/certs}
  
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/wms_billing_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

billing:
  accounting-scale: 2
  accounting-currency: TRY
  finance-service:
    url: ${WMS_FINANCE_SERVICE_URL:http://localhost:8083}

wms:
  security:
    cors:
      # UI origin'leri — virgulle ayrilmis liste
      allowed-origin-patterns: ${WMS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
