# Test profili — datasource dinamik olarak InventoryPostgresTestBase (Testcontainers) tarafından sağlanır.
# H2 kaldırıldı: yeni DB testleri yalnız gerçek PostgreSQL (Testcontainers) üzerinde koşar.
spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

wms:
  core-service:
    url: http://localhost:8081
  webclient:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
