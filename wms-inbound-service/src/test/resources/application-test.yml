# Test profili — datasource dinamik olarak InboundPostgresTestBase (Testcontainers) tarafından sağlanır.
# H2 kullanılmaz: DB testleri yalnız gerçek PostgreSQL (Testcontainers) üzerinde koşar.
spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
